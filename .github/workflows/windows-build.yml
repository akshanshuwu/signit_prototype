name: windows-build

on:
  push:
    paths:
      - "production/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "production/**"
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: production/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy==1.26.4
          python -m pip install pyldpc==0.7.7 --no-build-isolation
          Get-Content production/requirements.txt | Where-Object { $_ -notmatch '^\s*pyldpc==' } | Set-Content "$env:RUNNER_TEMP/requirements-nopyldpc.txt"
          python -m pip install -r "$env:RUNNER_TEMP/requirements-nopyldpc.txt"

      - name: Full test suite (all phases + live chain + hardening)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest production/tests/ -q

      - name: App smoke (live synth chain x4 + fallback, temp history DB)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m app.main --smoke --history-db "$env:RUNNER_TEMP/signit_smoke.db"
        working-directory: production

      - name: Build single-file .exe
        run: pyinstaller production/signit.spec --noconfirm

      - name: Verify artifact
        run: |
          if (-not (Test-Path "dist/SIGNIT.exe")) { throw "dist/SIGNIT.exe not produced" }
          (Get-Item "dist/SIGNIT.exe").Length
          $env:QT_QPA_PLATFORM = "offscreen"
          & "dist/SIGNIT.exe" --smoke --history-db "$env:RUNNER_TEMP/signit_exe_smoke.db"

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: SIGNIT-windows-exe
          path: dist/SIGNIT.exe
